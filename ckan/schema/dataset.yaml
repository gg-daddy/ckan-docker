scheming_version: 2
dataset_type: dataset
about: Dataset schema with resource access control
about_url: https://github.com/ckan/ckanext-scheming

dataset_fields:
  - field_name: title
    label: Title
    preset: title
    form_placeholder: eg. A descriptive title
    required: true

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Description
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    preset: tag_string_autocomplete
    form_placeholder: eg. economy, mental health, government

  - field_name: license_id
    label: License
    form_snippet: license.html
    help_text: License definitions and additional information can be found at http://opendefinition.org/

  - field_name: owner_org
    label: Organization
    preset: dataset_organization

  - field_name: author
    label: Author
    form_placeholder: Joe Bloggs
    display_property: dc:creator

  - field_name: author_email
    label: Author Email
    form_placeholder: joe@example.com
    display_property: dc:creator
    display_snippet: email.html
    display_email_name_field: author

  - field_name: maintainer
    label: Maintainer
    form_placeholder: Joe Bloggs
    display_property: dc:contributor

  - field_name: maintainer_email
    label: Maintainer Email
    form_placeholder: joe@example.com
    display_property: dc:contributor
    display_snippet: email.html
    display_email_name_field: maintainer

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label: Name
    form_placeholder: eg. January 2011 Gold Prices

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: format
    label: Format
    preset: resource_format_autocomplete

  - field_name: access_level
    label: Access Level
    preset: select
    form_include_blank_choice: false
    required: true
    choices:
      - value: public
        label: Public - Anyone can download
      - value: registered
        label: Registered Users - Must be logged in
      - value: same_organization
        label: Same Organization - Only members of the dataset's organization
      - value: only_allowed_users
        label: Allowed Users Only - Only specified users can download
    help_text: Control who can download this resource

  - field_name: allowed_users
    label: Allowed Users
    form_placeholder: "user1, user2, user3"
    help_text: Comma-separated list of usernames who can access this resource (only applies when Access Level is "Allowed Users Only")
