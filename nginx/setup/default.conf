# Upstream definitions
upstream portaljs {
    server portaljs:3000;
}

upstream ckan {
    server ckan:5000;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  localhost;

    ssl_certificate /etc/nginx/certs/ckan-local.crt;
    ssl_certificate_key /etc/nginx/certs/ckan-local.key;

    # TLS 1.2 & 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Disable weak ciphers
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';

    # SSL sessions
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Max upload size
    client_max_body_size 140M;

    # ===========================================
    # CKAN Routes (Admin, API, Auth)
    # ===========================================

    # CKAN API - always to CKAN
    location /api/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CKAN Admin interface (accessed via /ckan-admin/)
    location /ckan-admin/ {
        rewrite ^/ckan-admin/(.*)$ /$1 break;
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # User authentication and management
    location /user/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # Dashboard (authenticated users)
    location /dashboard/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # Organization management
    location /organization/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # Group management
    location /group/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # CKAN Dataset admin routes (new, edit, delete, etc.)
    location /dataset/new {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/edit/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/delete/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/[^/]+/resource/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/activity/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/groups/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    location ~ ^/dataset/collaborators/ {
        proxy_pass http://ckan;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
    }

    # CKAN webassets and static files
    location /webassets/ {
        proxy_pass http://ckan;
        proxy_set_header Host $host;
    }

    location /base/ {
        proxy_pass http://ckan;
        proxy_set_header Host $host;
    }

    location /fanstatic/ {
        proxy_pass http://ckan;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://ckan;
        proxy_set_header Host $host;
    }

    # ===========================================
    # PortalJS Routes (Public Frontend)
    # ===========================================

    # Next.js static assets
    location /_next/ {
        proxy_pass http://portaljs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 30m;
    }

    # PortalJS API routes (if any)
    location /api/portal/ {
        proxy_pass http://portaljs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other routes to PortalJS (public frontend)
    location / {
        proxy_pass http://portaljs;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
        proxy_cache_valid 30m;
    }

    # Error handling
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

    location = /error.html {
        ssi on;
        internal;
        auth_basic off;
        root /usr/share/nginx/html;
    }
}
